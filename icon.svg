<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Fondo full-bleed (maskable safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Brújula / círculo guía -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="10"/>
  <!-- Aguja de brújula (estilo origami) -->
  <polygon points="256,128 300,256 256,232 212,256" fill="#ffffff"/>
  <polygon points="256,384 212,256 256,280 300,256" fill="#ffffff" fill-opacity="0.6"/>
  <!-- Punto central -->
  <circle cx="256" cy="256" r="16" fill="#f59e0b"/>
</svg>
